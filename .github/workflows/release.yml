name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build with current Go; go.mod's version is only the minimum. Go 1.22
      # builds macOS binaries without LC_UUID, which current macOS refuses to run.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: go test ./...

      - name: Release notes from CHANGELOG.md
        run: sh scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
